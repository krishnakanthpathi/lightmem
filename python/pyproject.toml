[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lightmem"
version = "0.1.0"
description = "Ultra-fast, lightweight agent memory client for Python"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Krishnakanth"}
]
keywords = ["agent", "memory", "rag", "bm25", "embeddings", "sqlite", "vector"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lightmem*"]
