[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lmem"
version = "0.2.7"
description = "Ultra-Fast Local AI Agent Persistent Memory Engine with Neural Extractive QA & Knowledge Graph"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Pathi Krishna Kanth", email = "krishnakanthpathi@gmail.com" }
]
requires-python = ">=3.8"
keywords = [
    "agent",
    "memory",
    "ai",
    "llm",
    "rag",
    "knowledge-graph",
    "extractive-qa",
    "sqlite",
    "onnx",
    "fastembed",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
lmem = "lmem.cli:main"
lightmem = "lmem.cli:main"

[project.urls]
Homepage = "https://github.com/krishnakanthpathi/lightmem"
Repository = "https://github.com/krishnakanthpathi/lightmem"
Issues = "https://github.com/krishnakanthpathi/lightmem/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lmem", "src/lightmem"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
