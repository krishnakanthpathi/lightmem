[package]
name = "lightmem-ffi"
version = "0.1.0"
edition = "2021"
description = "Universal FFI layer for LightMem across Apple, Android, Linux, and Windows"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "lightmem_ffi"

[dependencies]
lightmem-core = { path = "../lightmem-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
uniffi = { version = "0.28", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
tempfile = "3.10"
