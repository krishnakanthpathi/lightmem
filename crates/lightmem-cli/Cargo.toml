[package]
name = "lightmem-cli"
version = "0.1.0"
edition = "2021"
description = "Fast CLI for lightweight agent memory (lmem)"

[[bin]]
name = "lmem"
path = "src/main.rs"

[[bin]]
name = "bench_harness"
path = "src/bin/bench_harness.rs"

[dependencies]
lightmem-core = { path = "../lightmem-core" }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
