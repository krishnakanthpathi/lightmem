[package]
name = "lightmem-core"
version = "0.1.0"
edition = "2021"
description = "Lightweight cross-platform agent memory engine"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
fastembed = "7.1.0"
ureq = { version = "2.10", features = ["json"] }
regex = "1.10"
dirs = "5.0"

[dev-dependencies]
tempfile = "3.10"
