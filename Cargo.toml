[package]
name = "lightmem"
version = "0.2.4"
edition = "2021"
description = "Ultra-fast, pure-Rust agent memory engine and CLI (lmem)"

[lib]
name = "lightmem"
path = "src/lib.rs"

[[bin]]
name = "lmem"
path = "src/main.rs"

[[bench]]
name = "bench_harness"
harness = false
path = "benches/bench_harness.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
fastembed = { version = "7.1.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
ureq = { version = "2.10", features = ["json"] }
regex = "1.10"
dirs = "5.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
colored = "2.1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "api-24", "download-binaries", "tls-rustls"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
ndarray = { version = "0.17.2", default-features = false }

[dev-dependencies]
tempfile = "3.10"
