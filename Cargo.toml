[package]
name = "lightmem"
version = "0.1.0"
edition = "2021"
description = "Ultra-fast, pure-Rust agent memory engine and CLI (lmem)"

[lib]
name = "lightmem"
path = "src/lib.rs"

[[bin]]
name = "lmem"
path = "src/main.rs"

[[bench]]
name = "bench_harness"
harness = false
path = "benches/bench_harness.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
fastembed = "7.1.0"
ureq = { version = "2.10", features = ["json"] }
regex = "1.10"
dirs = "5.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
