name: Publish Node Packages to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-platform-packages:
    name: Build Platform Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/lmem
            platform: darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/lmem
            platform: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/lmem.exe
            platform: win32-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Native Binary
        run: cargo build --release --target ${{ matrix.target }} --bin lmem

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bifurcate Release into Dedicated Platform Package
        run: node node/scripts/build-platform-packages.js ${{ matrix.binary }} ${{ matrix.platform }}

      - name: Upload Platform Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: node/npm/${{ matrix.platform }}/

  publish-to-npm:
    name: Publish All Platform Packages & Umbrella Package
    needs: [build-platform-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Download Platform Package Artifacts
        uses: actions/download-artifact@v4
        with:
          path: node/npm
          pattern: npm-*
          merge-multiple: false

      - name: Install Dependencies & Build Main Package
        run: |
          cd node
          npm ci || npm install
          npm run build
          npm test

      - name: Publish Bifurcated Platform Packages
        if: env.NPM_TOKEN != ''
        run: |
          for dir in node/npm/npm-*; do
            if [ -d "$dir" ]; then
              echo "Publishing $dir..."
              cd "$dir" && npm publish --access public || true
              cd - >/dev/null
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Main lmem Package
        if: env.NPM_TOKEN != ''
        run: |
          cd node
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
