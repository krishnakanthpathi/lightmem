name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            archive: lmem-aarch64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: lmem-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: lmem-x86_64-pc-windows-msvc.zip
          - os: ubuntu-latest
            target: aarch64-linux-android
            archive: lmem-aarch64-linux-android.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-ndk
        if: contains(matrix.target, 'android')
        run: cargo install cargo-ndk

      - name: Build Release Binary (Standard)
        if: "!contains(matrix.target, 'android')"
        run: cargo build --release --target ${{ matrix.target }} --bin lmem

      - name: Build Release Binary (Android)
        if: contains(matrix.target, 'android')
        run: cargo ndk --target ${{ matrix.target }} --platform 24 build --release --bin lmem

      - name: Package Tarball (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lmem dist/lmem
          find target/${{ matrix.target }}/release -maxdepth 2 -name "*.so" -exec cp {} dist/ \; || true
          chmod +x dist/lmem
          tar -czf ${{ matrix.archive }} -C dist .

      - name: Package Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lmem.exe" "dist/lmem.exe"
          Compress-Archive -Path "dist/lmem.exe" -DestinationPath "${{ matrix.archive }}" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lmem-${{ matrix.target }}
          path: ${{ matrix.archive }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
          generate_release_notes: true
